name: Browser tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional public site URL (leave empty to test current GitHub code locally)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Run browser tests and capture all six scenes
        env:
          TEST_BASE_URL: ${{ inputs.site_url }}
        run: npm run test:e2e
      - name: Upload desktop and mobile visual walkthroughs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-desktop-mobile
          path: test-results/visual-review/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
